mutation CreateInstitution(
  $input: CreateInstitutionInput!
) {
  createInstitution(
    input: $input
  ) {
    institution {
      id
      uuid
      name
      abbreviation
      description
      contact {
        phoneNumber
        postalAddress
        emailAddress
        websiteLocator
      }
    }
    errors {
      code
      message
      path
    }
  }
}
