fragment CurrentUserPartial on User {
  id
  uuid
  name
  hasPassword
  roles
  isAuthorizedToManageOpenIdConnect
  contact {
    emailAddress
    isEmailAddressConfirmed
    phoneNumber
  }
  representedInstitutions {
    edges {
      node {
        id
        uuid
        name
        pendingManufacturedComponents {
          totalCount
          isAuthorizedToConfirmEdges
        }
        pendingDevelopedMethods {
          totalCount
          isAuthorizedToConfirmEdges
        }
      }
    }
  }
}

query CurrentUser {
  currentUser {
    ...CurrentUserPartial
  }
  pendingDatabases {
    totalCount
  }
  pendingInstitutions {
    totalCount
  }
}

mutation LoginUser($input: LoginUserInput!) {
  loginUser(input: $input) {
    requiresTwoFactor
    user {
      ...CurrentUserPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation LoginUserWithTwoFactorCode($input: LoginUserWithTwoFactorCodeInput!) {
  loginUserWithTwoFactorCode(input: $input) {
    user {
      ...CurrentUserPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation LoginUserWithRecoveryCode($input: LoginUserWithRecoveryCodeInput!) {
  loginUserWithRecoveryCode(input: $input) {
    user {
      ...CurrentUserPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation LogoutUser {
  logoutUser {
    errors {
      code
      message
      path
    }
  }
}

mutation ChangeUserEmail($input: ChangeUserEmailInput!) {
  changeUserEmail(input: $input) {
    user {
      id
      contact {
        emailAddress
        isEmailAddressConfirmed
