    }
    errors {
      code
      message
      path
    }
  }
}

query TwoFactorAuthentication {
  currentUser {
    id
    twoFactorAuthentication {
      hasAuthenticator
      isEnabled
      isMachineRemembered
      recoveryCodesLeftCount
    }
  }
}

mutation GenerateUserTwoFactorRecoveryCodes {
  generateUserTwoFactorRecoveryCodes {
