  }
}

mutation ResendUserEmailConfirmation(
  $input: ResendUserEmailConfirmationInput!
) {
  resendUserEmailConfirmation(input: $input) {
    errors {
      code
      message
      path
    }
  }
}

mutation DeleteUser($input: DeleteUserInput!) {
  deleteUser(input: $input) {
    errors {
      code
      message
      path
    }
  }
}

mutation AddUserRole($input: AddUserRoleInput!) {
  addUserRole(input: $input) {
