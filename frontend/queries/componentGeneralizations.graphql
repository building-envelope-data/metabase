mutation AddComponentGeneralization(
  $input: AddComponentGeneralizationInput!
) {
  addComponentGeneralization(
    input: $input
  ) {
    errors {
      code
      message
      path
    }
  }
}

mutation RemoveComponentGeneralization(
  $input: RemoveComponentGeneralizationInput!
) {
  removeComponentGeneralization(
    input: $input
  ) {
    errors {
      code
      message
      path
    }
  }
}
