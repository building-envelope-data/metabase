#import "./openIdConnect.graphql"

query Tokens($applicationId: Uuid!) {
  openIdConnectApplication(uuid: $applicationId) {
    tokens {
      edges {
        node {
          ...TokenPartial
        }
      }
    }
  }
}

mutation RevokeToken($tokenId: Uuid!) {
  revokeOpenIdConnectToken(input: { tokenId: $tokenId }) {
    errors {
      code
      message
      path
    }
  }
}