#import "./openIdConnect.graphql"

query Authorizations($applicationId: Uuid!) {
  openIdConnectApplication(uuid: $applicationId) {
    authorizations {
      edges {
        node {
          ...AuthorizationPartial
        }
      }
    }
  }
}

mutation DeleteAuthorization($authorizationId: Uuid!) {
  deleteOpenIdConnectAuthorization(input: { authorizationId: $authorizationId }) {
    errors {
      code
      message
      path
    }
  }
}