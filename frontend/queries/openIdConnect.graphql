#import "./common.graphql"
#import "./institution.graphql"

fragment OpenIdConnectApplicationsPartial on OpenIdConnectApplication {
  id
  uuid
  name: clientId
  clientId
  description: displayName
  displayName
  postLogoutRedirectUri
  redirectUri
  consentType
  endpoints
  grantTypes
  responseTypes
  scopes
  requirements
  owner {
    node {
      id
      uuid
      name
    }
  }
}

fragment OpenIdConnectAuthorizationsPartial on OpenIdConnectAuthorization {
  id
  uuid
  name: uuid
  createdAt
  scopes
  status
  subject {
    id
    uuid
    name
  }
  type
  isAuthorizedToDeleteNode
  application {
    node {
      id
      uuid
      name: clientId
    }
  }
}

fragment OpenIdConnectTokensPartial on OpenIdConnectToken {
  id
  uuid
  name: uuid
  createdAt
  expiredAt
  redeemedAt
  status
  subject {
    ... on User {
      id
      uuid
      name
    }
    ... on OpenIdConnectApplication {
      id
      uuid
      name: clientId
    }
  }
  type
  isAuthorizedToRevokeNode
  authorization {
    node {
      id
      uuid
      name: uuid
    }
  }
  application {
    node {
      id
      uuid
      name: clientId
    }
  }
}

fragment OpenIdConnectApplicationPartial on OpenIdConnectApplication {
  ...OpenIdConnectApplicationsPartial
  isAuthorizedToManageNode
  authorizations {
    totalCount
  }
  tokens {
    totalCount
  }
}

query ApplicationNames(
  $first: Int!
  $after: String
  $where: OpenIdConnectApplicationFilterInput
  $order: [OpenIdConnectApplicationSortInput!]
) {
  connection: openIdConnectApplications(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        uuid
        name: clientId
      }
    }
  }
}

query Applications(
  $first: Int!
  $after: String
  $where: OpenIdConnectApplicationFilterInput
  $order: [OpenIdConnectApplicationSortInput!]
) {
  connection: openIdConnectApplications(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...OpenIdConnectApplicationsPartial
      }
    }
  }
}

query Application($id: Uuid!) {
  openIdConnectApplication(id: $id) {
    ...OpenIdConnectApplicationPartial
  }
}

