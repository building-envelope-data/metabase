fragment OpenIdConnectApplicationsPartial on OpenIdConnectApplication {
  id
  uuid
  name: clientId
  clientId
  description: displayName
  displayName
  postLogoutRedirectUri
  redirectUri
  consentType
  endpoints
  grantTypes
  responseTypes
  scopes
  requirements
  owner {
    node {
      uuid
      name
    }
  }
}

fragment OpenIdConnectAuthorizationPartial on OpenIdConnectAuthorization {
  id
  uuid
  createdAt
  status
  subject
  type
  isAuthorizedToDeleteNode
}

fragment OpenIdConnectTokenPartial on OpenIdConnectToken {
  id
  uuid
  createdAt
  expiredAt
  redeemedAt
  status
  subject
  type
  isAuthorizedToRevokeNode
}

fragment OpenIdConnectApplicationPartial on OpenIdConnectApplication {
  ...OpenIdConnectApplicationsPartial
  isAuthorizedToManageNode
  authorizations {
    totalCount
    edges {
      node {
        ...OpenIdConnectAuthorizationPartial
      }
    }
  }
  tokens {
    totalCount
    edges {
      node {
        ...OpenIdConnectTokenPartial
      }
    }
  }
}

query ApplicationNames(
  $first: Int!
  $after: String
  $where: OpenIdConnectApplicationFilterInput
  $order: [OpenIdConnectApplicationSortInput!]
) {
  connection: openIdConnectApplications(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        uuid
        name: clientId
      }
    }
  }
}

query Applications(
  $first: Int!
  $after: String
  $where: OpenIdConnectApplicationFilterInput
  $order: [OpenIdConnectApplicationSortInput!]
) {
  connection: openIdConnectApplications(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...OpenIdConnectApplicationsPartial
      }
    }
  }
}

query Application($uuid: Uuid!) {
  openIdConnectApplication(id: $uuid) {
    ...OpenIdConnectApplicationPartial
  }
}

mutation CreateApplication($input: CreateOpenIdConnectApplicationInput!) {
  createOpenIdConnectApplication(input: $input) {
    application {
      ...OpenIdConnectApplicationPartial
    }
    clientSecret
    errors {
      code
      message
      path
    }
  }
}

mutation UpdateApplication($input: UpdateOpenIdConnectApplicationInput!) {
  updateOpenIdConnectApplication(input: $input) {
    application {
      ...OpenIdConnectApplicationPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation ResetApplicationClientSecret(
  $input: ResetOpenIdConnectApplicationClientSecretInput!
) {
  resetOpenIdConnectApplicationClientSecret(input: $input) {
    clientSecret
    errors {
      code
      message
      path
    }
  }
}

mutation DeleteApplication($input: DeleteOpenIdConnectApplicationInput!) {
  deleteOpenIdConnectApplication(input: $input) {
    errors {
      code
      message
      path
    }
  }
}

mutation DeleteAuthorization($input: DeleteOpenIdConnectAuthorizationInput!) {
  deleteOpenIdConnectAuthorization(input: $input) {
    errors {
      code
      message
      path
    }
  }
}

mutation RevokeToken($input: RevokeOpenIdConnectTokenInput!) {
  revokeOpenIdConnectToken(input: $input) {
    token {
      id
      status
    }
    errors {
      code
      message
      path
    }
  }
}
