mutation CreateApplication($input: CreateOpenIdConnectApplicationInput!) {
  createOpenIdConnectApplication(input: $input) {
    application {
      ...OpenIdConnectApplicationPartial
      owner {
        node {
          ...InstitutionPartial
        }
      }
    }
    clientSecret
    errors {
      code
      message
      path
    }
  }
}

mutation UpdateApplication($input: UpdateOpenIdConnectApplicationInput!) {
  updateOpenIdConnectApplication(input: $input) {
    application {
      ...OpenIdConnectApplicationPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation ResetApplicationClientSecret(
  $input: ResetOpenIdConnectApplicationClientSecretInput!
) {
  resetOpenIdConnectApplicationClientSecret(input: $input) {
    clientSecret
    errors {
      code
      message
      path
    }
  }
}

mutation DeleteApplication($input: DeleteOpenIdConnectApplicationInput!) {
  deleteOpenIdConnectApplication(input: $input) {
    errors {
      code
      message
      path
    }
  }
}

query Authorizations(
  $first: Int!
  $after: String
  $where: OpenIdConnectAuthorizationFilterInput
  $order: [OpenIdConnectAuthorizationSortInput!]
) {
  connection: openIdConnectAuthorizations(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...OpenIdConnectAuthorizationsPartial
      }
    }
  }
}

mutation DeleteAuthorization($input: DeleteOpenIdConnectAuthorizationInput!) {
  deleteOpenIdConnectAuthorization(input: $input) {
    application {
      ...OpenIdConnectApplicationPartial
    }
    errors {
      code
      message
      path
    }
  }
}

query Tokens(
  $first: Int!
  $after: String
  $where: OpenIdConnectTokenFilterInput
  $order: [OpenIdConnectTokenSortInput!]
) {
  connection: openIdConnectTokens(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...OpenIdConnectTokensPartial
      }
    }
  }
}

mutation RevokeToken($input: RevokeOpenIdConnectTokenInput!) {
  revokeOpenIdConnectToken(input: $input) {
    token {
      id
      status
    }
    errors {
      code
      message
      path
    }
  }
}
