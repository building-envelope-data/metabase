#import "./components.graphql"

mutation AddComponentManufacturer($input: AddComponentManufacturerInput!) {
  addComponentManufacturer(input: $input) {
    componentManufacturerEdge {
      node {
        ...InstitutionPartial
      }
    }
    manufacturedComponentEdge {
      node {
        ...ComponentPartial
      }
    }
    errors {
      code
      message
      path
    }
  }
}

mutation ConfirmComponentManufacturer(
  $input: ConfirmComponentManufacturerInput!
) {
  confirmComponentManufacturer(input: $input) {
    componentManufacturerEdge {
      node {
        ...InstitutionPartial
      }
    }
    manufacturedComponentEdge {
      node {
        ...ComponentPartial
      }
    }
    errors {
      code
      message
      path
    }
  }
}

mutation RemoveComponentManufacturer(
  $input: RemoveComponentManufacturerInput!
) {
  removeComponentManufacturer(input: $input) {
    component {
      ...ComponentPartial
    }
    institution {
      ...InstitutionPartial
    }
    errors {
      code
      message
      path
    }
  }
}
