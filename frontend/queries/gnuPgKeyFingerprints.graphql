fragment GnuPgKeyFingerprintsPartial on GnuPgKeyFingerprint {
  id
  uuid
  name: fingerprint
  fingerprint
  allowedAt
  forbiddenAt
  user {
    node {
      id
      uuid
      name
    }
  }
  institution {
    node {
      id
      uuid
      name
    }
  }
  isAuthorizedToAllowNode
  isAuthorizedToForbidNode
}

fragment GnuPgKeyFingerprintPartial on GnuPgKeyFingerprint {
  ...GnuPgKeyFingerprintsPartial
}

query GnuPgKeyFingerprintNames(
  $first: Int!
  $after: String
  $where: GnuPgKeyFingerprintFilterInput
  $order: [GnuPgKeyFingerprintSortInput!]
) {
  connection: gnuPgKeyFingerprints(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        uuid
        name: fingerprint
      }
    }
  }
}

query GnuPgKeyFingerprints(
  $first: Int!
  $after: String
  $where: GnuPgKeyFingerprintFilterInput
  $order: [GnuPgKeyFingerprintSortInput!]
) {
  connection: gnuPgKeyFingerprints(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...GnuPgKeyFingerprintsPartial
      }
    }
  }
}

mutation AddGnuPgKeyFingerprint($input: AddGnuPgKeyFingerprintInput!) {
  addGnuPgKeyFingerprint(input: $input) {
    gnuPgKeyFingerprint {
      ...GnuPgKeyFingerprintsPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation AllowGnuPgKeyFingerprint($fingerprint: String!) {
  allowGnuPgKeyFingerprint(input: { fingerprint: $fingerprint }) {
    gnuPgKeyFingerprint {
      id
      allowedAt
    }
    errors {
      code
      message
      path
    }
  }
}

mutation ForbidGnuPgKeyFingerprint($fingerprint: String!) {
  forbidGnuPgKeyFingerprint(input: { fingerprint: $fingerprint }) {
    gnuPgKeyFingerprint {
      id
      forbiddenAt
    }
    errors {
      code
      message
      path
    }
  }
}

query GnuPgKeyFingerprint($fingerprint: String!) {
  gnuPgKeyFingerprint(fingerprint: $fingerprint) {
    ...GnuPgKeyFingerprintPartial
  }
}
