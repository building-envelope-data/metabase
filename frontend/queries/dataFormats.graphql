fragment DataFormatPartial on DataFormat {
  id
  uuid
  name
  extension
  description
  mediaType
  schemaLocator
  reference {
    ... on Standard {
      abstract
      section
      title
      locator
      numeration {
        mainNumber
        prefix
        suffix
      }
      standardizers
      year
    }
    ... on Publication {
      abstract
      section
      title
      arXiv
      authors
      doi
      urn
      webAddress
    }
  }
  manager {
    node {
      id
      uuid
      name
    }
  }
}

query DataFormats {
  dataFormats {
    edges {
      node {
        ...DataFormatPartial
      }
    }
  }
}

query DataFormat($uuid: Uuid!) {
  dataFormat(id: $uuid) {
    ...DataFormatPartial
    isAuthorizedToUpdateNode
  }
}

mutation CreateDataFormat(
  $input: CreateDataFormatInput!
) {
  createDataFormat(
    input: $input
  ) {
    dataFormat {
      ...DataFormatPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation UpdateDataFormat(
  $input: UpdateDataFormatInput!
) {
  updateDataFormat(
    input: $input
  ) {
    dataFormat {
      ...DataFormatPartial
    }
    errors {
      code
      message
      path
    }
  }
}
