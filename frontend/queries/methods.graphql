fragment MethodPartial on Method {
  id
  uuid
  name
  description
  validity {
    from
    to
  }
  availability {
    from
    to
  }
  reference {
    ... on Standard {
      abstract
      section
      title
      locator
      numeration {
        mainNumber
        prefix
        suffix
      }
      standardizers
      year
    }
    ... on Publication {
      abstract
      section
      title
      arXiv
      authors
      doi
      urn
      webAddress
    }
  }
  calculationLocator
  categories
  developers {
    edges {
      node {
        ... on Institution {
          id
          uuid
          name
          description
        }
        ... on User {
          id
          uuid
          name
        }
      }
      isAuthorizedToConfirmEdge
      isAuthorizedToRemoveEdge
    }
    isAuthorizedToAddInstitutionEdge
    isAuthorizedToAddUserEdge
  }
  pendingDevelopers: developers(pending: true) {
    edges {
      node {
        ... on Institution {
          id
          uuid
          name
          description
        }
        ... on User {
          id
          uuid
          name
        }
      }
      isAuthorizedToConfirmEdge
      isAuthorizedToRemoveEdge
    }
  }
  manager {
    node {
      id
      uuid
      name
    }
  }
}

query Methods {
  methods {
    edges {
      node {
        ...MethodPartial
      }
    }
  }
}

query Method($uuid: Uuid!) {
  method(id: $uuid) {
    ...MethodPartial
    isAuthorizedToUpdateNode
  }
}

mutation CreateMethod($input: CreateMethodInput!) {
  createMethod(input: $input) {
    method {
      ...MethodPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation UpdateMethod($input: UpdateMethodInput!) {
  updateMethod(input: $input) {
    method {
      ...MethodPartial
    }
    errors {
      code
      message
      path
    }
  }
}
