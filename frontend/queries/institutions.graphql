#import "./openIdConnect.graphql"
#import "./gnuPgKeyFingerprints.graphql"

fragment ContactInformationPartial on ContactInformation {
  phoneNumber
  postalAddress
  emailAddress
  websiteLocator
}

fragment InstitutionPartial on Institution {
  id
  uuid
  name
  abbreviation
  description
  contact {
    ...ContactInformationPartial
  }
  state
  operatingState
}

query Institutions {
  institutions(first: 2147483646) {
    edges {
      node {
        ...InstitutionPartial
      }
    }
  }
}

query PendingInstitutions {
  pendingInstitutions {
    edges {
      node {
        ...InstitutionPartial
      }
    }
  }
}

mutation CreateInstitution(
  $name: String!
  $abbreviation: String
  $description: String!
  $contact: ContactInformationInput
  $ownerIds: [Uuid!]!
  $managerId: Uuid
) {
  createInstitution(
    input: {
      name: $name
      abbreviation: $abbreviation
      description: $description
      contact: $contact
      ownerIds: $ownerIds
      managerId: $managerId
    }
  ) {
    institution {
      ...InstitutionPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation UpdateInstitution(
  $institutionId: Uuid!
  $name: String!
  $abbreviation: String
  $description: String!
  $contact: ContactInformationInput
) {
  updateInstitution(
    input: {
      institutionId: $institutionId
      name: $name
      abbreviation: $abbreviation
      description: $description
      contact: $contact
    }
  ) {
    institution {
      ...InstitutionPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation VerifyInstitution($institutionId: Uuid!) {
  verifyInstitution(input: { institutionId: $institutionId }) {
    institution {
      ...InstitutionPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation DeleteInstitution($institutionId: Uuid!) {
  deleteInstitution(input: { institutionId: $institutionId }) {
    errors {
      code
      message
      path
    }
  }
}
mutation SwitchInstitutionOperatingState($institutionId: Uuid!) {
  switchInstitutionOperatingState(input: { institutionId: $institutionId }) {
    errors {
      code
      message
      path
    }
  }
}

query Institution($uuid: Uuid!) {
  institution(id: $uuid) {
    ...InstitutionPartial
    extras
    isAuthorizedToUpdateNode
    isAuthorizedToDeleteNode
    isAuthorizedToSwitchOperatingStateOfNode
    manufacturedComponents {
      edges {
        node {
          id
          uuid
          name
          abbreviation
          description
          categories
          availability {
            from
            to
          }
        }
      }
      isAuthorizedToAddEdge
    }
    pendingManufacturedComponents: manufacturedComponents(pending: true) {
      edges {
        node {
          id
          uuid
          name
        }
      }
      isAuthorizedToConfirmEdge
    }
    operatedDatabases {
      edges {
        node {
          id
          uuid
          name
          description
          locator
          operator {
            node {
              id
              uuid
              name
            }
          }
        }
      }
      isAuthorizedToAddEdge
    }
    representatives {
      edges {
        node {
          id
          uuid
          name
        }
        role
        isAuthorizedToRemoveEdge
      }
      isAuthorizedToAddEdge
    }
    pendingRepresentatives: representatives(pending: true) {
      edges {
        node {
          id
          uuid
          name
        }
        role
        isAuthorizedToRemoveEdge
      }
    }
    manager {
      node {
        id
        uuid
        name
      }
    }
    managedDataFormats {
      edges {
        node {
          id
          uuid
          name
          extension
          description
          mediaType
          schemaLocator
          reference {
            ... on Standard {
              abstract
              section
              title
              locator
              numeration {
                mainNumber
                prefix
                suffix
              }
              standardizers
              year
            }
            ... on Publication {
              abstract
              section
              title
              arXiv
              authors
              doi
              urn
              webAddress
            }
          }
          manager {
            node {
              id
              uuid
              name
            }
          }
        }
      }
      isAuthorizedToAddEdge
    }
    managedMethods {
      edges {
        node {
          id
          uuid
          name
          description
          validity {
            from
            to
          }
          availability {
            from
            to
          }
          reference {
            ... on Standard {
              abstract
              section
              title
              locator
              numeration {
                mainNumber
                prefix
                suffix
              }
              standardizers
              year
            }
            ... on Publication {
              abstract
              section
              title
              arXiv
              authors
              doi
              urn
              webAddress
            }
          }
          calculationLocator
          categories
        }
      }
      isAuthorizedToAddEdge
    }
    developedMethods {
      edges {
        node {
          id
          uuid
          name
        }
      }
    }
    pendingDevelopedMethods: developedMethods(pending: true) {
      edges {
        node {
          id
          uuid
          name
        }
      }
      isAuthorizedToConfirmEdge
    }
    gnuPgKeyFingerprints {
      edges {
        node {
          ...GnuPgKeyFingerprintPartial
        }
      }
      isAuthorizedToAddEdge
    }
    openIdConnectApplications {
      edges {
        node {
          ...ApplicationPartial
        }
      }
      isAuthorizedToAddEdge
    }
    managedInstitutions {
      edges {
        node {
          id
          uuid
          name
        }
      }
      isAuthorizedToAddEdge
    }
  }
}
