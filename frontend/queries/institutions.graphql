#import "./common.graphql"
#import "./components.graphql"
#import "./dataFormats.graphql"
#import "./databases.graphql"
#import "./gnuPgKeyFingerprints.graphql"
#import "./methods.graphql"
#import "./openIdConnect.graphql"

fragment InstitutionsPartial on Institution {
  id
  uuid
  name
  abbreviation
  description
  state
  operatingState
  contact {
    ...ContactInformationPartial
  }
  representatives {
    totalCount
    edges {
      node {
        id
        uuid
        name
      }
      role
    }
  }
}

fragment PendingInstitutionsPartial on Institution {
  ...InstitutionsPartial
  isAuthorizedToVerifyNode
}

fragment InstitutionPartial on Institution {
  ...InstitutionsPartial
  extras
  isAuthorizedToVerifyNode
  isAuthorizedToUpdateNode
  isAuthorizedToDeleteNode
  isAuthorizedToSwitchOperatingStateOfNode
  manufacturedComponents {
    totalCount
  }
  managedComponents {
    totalCount
    isAuthorizedToAddEdge
  }
  pendingManufacturedComponents {
    totalCount
    edges {
      node {
        ...ComponentsPartial
      }
    }
    isAuthorizedToConfirmEdges
  }
  operatedDatabases {
    totalCount
    isAuthorizedToAddEdge
  }
  representatives {
    totalCount
    edges {
      node {
        id
        uuid
        name
      }
      role
      isAuthorizedToRemoveEdge
    }
    isAuthorizedToAddEdge
  }
  pendingRepresentatives {
    totalCount
    edges {
      node {
        id
        uuid
        name
      }
      role
      isAuthorizedToRemoveEdge
    }
  }
  manager {
    node {
      id
      uuid
      name
    }
  }
  managedDataFormats {
    totalCount
    isAuthorizedToAddEdge
  }
  managedMethods {
    totalCount
    isAuthorizedToAddEdge
  }
  institutionDevelopedMethods: developedMethods {
    totalCount
  }
  pendingInstitutionDevelopedMethods: pendingDevelopedMethods {
    totalCount
    edges {
      node {
        ...MethodsPartial
      }
    }
    isAuthorizedToConfirmEdges
  }
  gnuPgKeyFingerprints {
    totalCount
    edges {
      node {
        ...GnuPgKeyFingerprintsPartial
      }
    }
    isAuthorizedToAddEdge
  }
  openIdConnectApplications {
    totalCount
    isAuthorizedToAddEdge
  }
  managedInstitutions {
    totalCount
    isAuthorizedToAddEdge
  }
}

query InstitutionNames(
  $first: Int!
  $after: String
  $where: InstitutionFilterInput
  $order: [InstitutionSortInput!]
) {
  connection: institutions(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        uuid
        name
      }
    }
  }
}

query Institutions(
  $first: Int!
  $after: String
  $where: InstitutionFilterInput
  $order: [InstitutionSortInput!]
) {
  connection: institutions(
    first: $first
    after: $after
    where: $where
    order: $order
  ) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...InstitutionsPartial
      }
    }
  }
}

query PendingInstitutions {
  pendingInstitutions {
    totalCount
    edges {
      node {
        ...PendingInstitutionsPartial
      }
    }
  }
}

query Institution($uuid: Uuid!) {
  institution(id: $uuid) {
    ...InstitutionPartial
  }
}

mutation CreateInstitution($input: CreateInstitutionInput!) {
  createInstitution(input: $input) {
    institution {
      ...InstitutionPartial
      manager {
        node {
          ...InstitutionPartial
        }
      }
      representatives {
        edges {
          node {
            ...UserPartial
          }
          role
        }
      }
    }
    errors {
      code
      message
      path
    }
  }
}

mutation UpdateInstitution($input: UpdateInstitutionInput!) {
  updateInstitution(input: $input) {
    institution {
      ...InstitutionPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation VerifyInstitution($institutionId: Uuid!) {
  verifyInstitution(input: { institutionId: $institutionId }) {
    institution {
      ...InstitutionPartial
    }
    errors {
      code
      message
      path
    }
  }
}

mutation SwitchInstitutionOperatingState($institutionId: Uuid!) {
  switchInstitutionOperatingState(input: { institutionId: $institutionId }) {
    institution {
      id
      operatingState
    }
    errors {
      code
      message
      path
    }
  }
}

mutation DeleteInstitution($institutionId: Uuid!) {
  deleteInstitution(input: { institutionId: $institutionId }) {
    errors {
      code
      message
      path
    }
  }
}
